name: "Lint, Build and Test (Reusable)"

on:
  workflow_call:
    inputs:
      upload_artifacts:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  linting:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          uv_version: "0.11.0"
          python_version_file: ".python-version"

      - name: Run ruff lint check
        run: uvx ruff check . --respect-gitignore --exclude datam8-model/

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run ty code analysis
        # version pin ty to avoid unnecessary issues
        run: uvx --from "ty==$uv_version" ty check src --exit-zero-on-warning
        env:
          uv_version: "0.0.60"

      # TODO: deactivate for now due to false positives with generics
      # - name: Run pyright code analysis
      #   run: uvx  src

  building:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          uv_version: "0.11.0"
          python_version_file: ".python-version"

      - name: Build the application
        run: uv build

      - name: Smoke-test the installed wheel without development dependencies
        run: |
          uv venv .package-smoke
          uv pip install --python .package-smoke/bin/python dist/*.whl
          .package-smoke/bin/datam8 --help
          .package-smoke/bin/datam8 --version

      - name: Smoke-test API and offline ODCS from the installed package
        run: |
          WHEEL=$(find dist -name '*.whl' -print -quit)
          uv pip install --python .package-smoke/bin/python "$WHEEL[api]"
          .package-smoke/bin/python scripts/check_package.py .package-smoke/evidence tests/builtin_plugins/full-example.odcs.yaml

      - name: Upload Build Artifacts
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-artifacts
          path: dist
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  testing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false

      - name: Check out solution repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: oraylis/datam8-sample-solution
          # Existing legacy fixture, pinned to the v2.0.0-beta.3 commit.
          ref: 68001a2dcaa0b2931ee341f3527b96266a6e46da
          path: datam8-sample-solution
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          uv_version: "0.11.0"
          python_version_file: ".python-version"

      - name: Install packages
        run: uv sync --frozen --all-extras

      - name: Run pytests
        run: uv run --frozen pytest tests --solution-path datam8-sample-solution/ORAYLISDatabricksSample.dm8s --junitxml=TEST-generator-pytest.xml
        env:
          NO_COLOR: 1
          FORCE_COLOR: 0
          TERM: dumb

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-results
          path: TEST-generator-pytest.xml
          retention-days: 14
          if-no-files-found: warn
