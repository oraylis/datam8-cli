name: Documentation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs
